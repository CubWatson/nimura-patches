name: Build

on:
  push:
    branches: ['**']   # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: nimurapatches
          path: build/libs/nimurapatches-*.jar
          if-no-files-found: error
