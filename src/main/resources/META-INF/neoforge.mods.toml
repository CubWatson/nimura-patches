[[mods]]
modId="nimurapatches"
version="1.3.0"
displayName="Nimura Patches"
authors="Kevin (CubWatson)"
description='''Small compatibility fixes for the Nimura modpack:
- Oreganized: lead door no longer crashes the world when one half is missing.
- Deep Aether: a failed player login no longer crashes the server in the logout handler.
- Ribbits: a ribbit without a home position no longer crashes the server.
- Create: a potato cannon projectile with a missing projectile type removes itself instead of crashing.
- Croaks: a raid wave whose spawn spot never works no longer hangs the server forever.'''

